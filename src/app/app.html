<div class="app-container" (keydown.escape)="closeSidebar()">
  <header class="header">
    <h1 class="pointer" routerLink="/" aria-label="Home page">
      <img src="/logo.png" width="48px" height="48px" alt="logo" />
      <span class="hidden">Logo</span>
    </h1>

    <div class="header__right">
      <!-- Ngoài nhánh đăng nhập để người chưa đăng nhập cũng đổi được giao diện -->
      <button
        mat-icon-button
        [matMenuTriggerFor]="themeMenu"
        aria-label="Chọn giao diện sáng tối"
        matTooltip="Giao diện"
      >
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>
      <mat-menu #themeMenu="matMenu">
        <button mat-menu-item (click)="setTheme('light')">
          <mat-icon>light_mode</mat-icon>
          <span>Sáng</span>
          @if (themeMode() === 'light') { <mat-icon class="theme-check">check</mat-icon> }
        </button>
        <button mat-menu-item (click)="setTheme('dark')">
          <mat-icon>dark_mode</mat-icon>
          <span>Tối</span>
          @if (themeMode() === 'dark') { <mat-icon class="theme-check">check</mat-icon> }
        </button>
        <button mat-menu-item (click)="setTheme('system')">
          <mat-icon>brightness_auto</mat-icon>
          <span>Theo hệ thống</span>
          @if (themeMode() === 'system') { <mat-icon class="theme-check">check</mat-icon> }
        </button>
      </mat-menu>

      <ng-container *ngIf="user$ | async as user; else loginSection">
        <span class="user-name">Xin chào, {{ user.fullname }}!</span>
        <button
          mat-icon-button
          class="settings-btn"
          aria-label="settings"
          (click)="toggleSidebar()"
          [class.active]="sidebarOpen"
          [attr.aria-expanded]="sidebarOpen"
        >
          <mat-icon>settings</mat-icon>
        </button>
      </ng-container>

      <ng-template #loginSection>
        <button
          mat-icon-button
          color="primary"
          aria-label="login"
          (click)="openLoginPopup()"
        >
          <mat-icon>login</mat-icon>
        </button>
      </ng-template>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Sidebar -->
  <div
    class="sidebar-overlay"
    *ngIf="sidebarOpen"
    (click)="closeSidebar()"
  ></div>

  <aside
    class="sidebar"
    [class.open]="sidebarOpen"
    [attr.aria-hidden]="!sidebarOpen"
    [attr.inert]="sidebarOpen ? null : ''"
  >
    <nav class="sidebar-content" aria-label="Menu tài khoản">
      <div class="sidebar-actions">
        <button type="button" class="sidebar-action" (click)="redirectToList()">
          <mat-icon>receipt_long</mat-icon>
          <span class="action__text">Danh sách đã chia sẻ</span>
        </button>
        <button type="button" class="sidebar-action" (click)="redirectToSetting()">
          <mat-icon>settings</mat-icon>
          <span class="action__text">Cài đặt</span>
        </button>
        <button type="button" class="sidebar-action" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span class="action__text">Đăng xuất</span>
        </button>
      </div>
    </nav>
  </aside>

  <app-pwa-install-prompt></app-pwa-install-prompt>
</div>
