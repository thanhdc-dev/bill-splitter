<div class="app-container" (keydown.escape)="closeSidebar()">
  <header class="header">
    <h1>
      <a class="pointer logo-link" routerLink="/" aria-label="Home page">
        <img src="/logo.png" width="48px" height="48px" alt="logo" />
        <span class="hidden">Logo</span>
      </a>
    </h1>

    <div class="header__right">
      <!-- Ngoài nhánh đăng nhập để người chưa đăng nhập cũng đổi được giao diện -->
      <button
        mat-icon-button
        (click)="toggleTheme()"
        [attr.aria-label]="themeToggleLabel()"
        [matTooltip]="themeToggleLabel()"
        >
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>

      @if (user$ | async; as user) {
        <span class="user-name" [attr.title]="user.fullname">Hi, {{ user.fullname }}</span>
        <button
          mat-icon-button
          class="settings-btn"
          aria-label="settings"
          (click)="toggleSidebar()"
          [class.active]="sidebarOpen"
          [attr.aria-expanded]="sidebarOpen"
          >
          <mat-icon>settings</mat-icon>
        </button>
      } @else {
        <button
          mat-icon-button
          color="primary"
          aria-label="login"
          (click)="openLoginPopup()"
          >
          <mat-icon>login</mat-icon>
        </button>
      }

    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Sidebar -->
  @if (sidebarOpen) {
    <div
      class="sidebar-overlay"
      (click)="closeSidebar()"
    ></div>
  }

  <aside
    class="sidebar"
    [class.open]="sidebarOpen"
    [attr.aria-hidden]="!sidebarOpen"
    [attr.inert]="sidebarOpen ? null : ''"
    >
    <nav class="sidebar-content" aria-label="Menu tài khoản">
      <div class="sidebar-actions">
        <button type="button" class="sidebar-action" (click)="redirectToList()">
          <mat-icon>receipt_long</mat-icon>
          <span class="action__text">Danh sách đã chia sẻ</span>
        </button>
        <button type="button" class="sidebar-action" (click)="redirectToSetting()">
          <mat-icon>settings</mat-icon>
          <span class="action__text">Cài đặt</span>
        </button>
        <button type="button" class="sidebar-action" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span class="action__text">Đăng xuất</span>
        </button>
      </div>
    </nav>
  </aside>

  <app-pwa-install-prompt></app-pwa-install-prompt>
</div>
