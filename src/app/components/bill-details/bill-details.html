<div class="bill-splitter-container">
  <mat-card>
    <mat-card-content>
      @if (isEditable) {
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Tên hóa đơn</mat-label>
        <input matInput [formControl]="nameCtrl" placeholder="Tên hóa đơn, cửa hàng, quán ăn..."/>
      </mat-form-field>
      } @else {
      <div class="text-2xl font-bold mb-4">
        {{nameCtrl.value}}
      </div>
      }
      @if (isEditable) {
      <mat-tab-group #tabGroup mat-stretch-tabs="false" mat-align-tabs="start">
        <mat-tab>
          <ng-template mat-tab-label>
            <h2 class="mat-tab-label">
              <span class="label">Khoản mục</span>
              <mat-icon class="icon">receipt</mat-icon>
            </h2>
          </ng-template>
          <div class="expense-form">
            <app-expense-form></app-expense-form>
          </div>
        </mat-tab>
        <mat-tab>
          <ng-template mat-tab-label>
            <h2 class="mat-tab-label">
              <span class="label">Thành viên</span>
              <mat-icon class="icon">groups</mat-icon>
            </h2>
          </ng-template>
          <div class="member-table">
            <app-member-table></app-member-table>
          </div>
        </mat-tab>
        <mat-tab>
          <ng-template mat-tab-label>
            <h2 class="mat-tab-label">
              <span class="label">Thanh toán</span>
              <mat-icon class="icon">credit_card</mat-icon>
            </h2>
          </ng-template>
          <div class="payment">
            <app-payment></app-payment>
          </div>
        </mat-tab>
      </mat-tab-group>
      }
      <app-image-upload [maxFiles]="5" [maxFileSize]="5*1024*1024" [imageStoragePaths]="oldImages" [isEditable]="isEditable"
        (imagesChanged)="onImagesChanged($event)">
      </app-image-upload>
    </mat-card-content>
  </mat-card>
  <app-result-display></app-result-display>
  <app-bank></app-bank>
  @if (uploadProgress !== null) {
  <div class="upload-progress fixed bottom-[170px] right-7" role="status" aria-live="polite">
    <mat-progress-spinner mode="determinate" [value]="uploadProgress" diameter="40"></mat-progress-spinner>
    <span class="upload-progress__label">{{ uploadProgress }}%</span>
  </div>
  }

  <div class="buttons flex flex-col items-end gap-4 fixed bottom-[100px] right-7">
    <!-- Sticky Share Button -->
    <button mat-fab color="primary" class="share-button" aria-label="Lưu và sao chép link chia sẻ"
      matTooltip="Lưu và sao chép link chia sẻ" matTooltipPosition="left"
      [ngClass]="{'share-button__syncing': (isSaving$ | async)}" [disabled]="(isSaving$ | async)" (click)="save(true)">
      <mat-icon>{{(isSaving$ | async) ? 'sync' : 'share'}}</mat-icon>
    </button>
    <!-- Sticky Auto Save Button -->
    @if(isEditable) {
    <button mat-fab color="primary" class="auto-save-button" aria-label="Lưu hóa đơn"
      matTooltip="Lưu hóa đơn" matTooltipPosition="left" (click)="save()">
      <mat-icon>{{(isChange$ | async) ? 'cloud_upload' : 'cloud_done'}}</mat-icon>
    </button>
    }
  </div>
</div>
