<div class="list-container">
  <h2 class="list-title">Danh sách</h2>

  @if (isLoading) {
  <div class="list-loading" role="status" aria-live="polite">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Đang tải danh sách hóa đơn...</p>
  </div>
  }

  @else if (hasError) {
  <app-empty-state
    icon="cloud_off"
    title="Không tải được danh sách"
    description="Có lỗi khi kết nối tới máy chủ. Kiểm tra kết nối mạng rồi thử lại."
  >
    <button mat-raised-button color="primary" (click)="loadData()">
      <mat-icon>refresh</mat-icon>
      Thử lại
    </button>
  </app-empty-state>
  }

  @else if (!bills.length) {
  <app-empty-state
    icon="receipt_long"
    title="Chưa có hóa đơn nào được chia sẻ"
    description="Những hóa đơn bạn lưu và chia sẻ sẽ xuất hiện ở đây để mở lại hoặc gửi cho bạn bè."
  >
    <button mat-raised-button color="primary" routerLink="/">
      <mat-icon>add</mat-icon>
      Tạo hóa đơn mới
    </button>
  </app-empty-state>
  }

  @else {
  <div class="bill-wrapper">
    <div
      *ngFor="let item of bills"
      class="bill"
      role="button"
      tabindex="0"
      (click)="onItemClick(item.code)"
      (keydown.enter)="onItemClick(item.code)"
      (keydown.space)="$event.preventDefault(); onItemClick(item.code)"
    >
      <div class="bill-content">
        <div class="bill-info">
          <div class="bill-header">
            <span class="bill-code">{{ item.code }}</span>
            <span class="bill-date">{{ formatDate(item.createdAt) }}</span>
          </div>
          <h3 class="bill-name">{{ item.name }}</h3>
        </div>

        <div class="actions">
          <button
            class="copy-btn"
            (click)="onCopyUrl($event, item.code)"
            title="Copy URL"
            aria-label="Copy URL"
          >
            <mat-icon>content_copy</mat-icon>
          </button>
          <button
            class="ml-2"
            mat-icon-button
            aria-label="remove"
            color="warn"
            (click)="onDelete($event, item.code)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
  }
</div>
