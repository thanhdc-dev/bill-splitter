<div class="bill-splitter-container">
  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Tên hóa đơn</mat-label>
        <input matInput [formControl]="nameCtrl" placeholder="Tên hóa đơn, cửa hàng, quán ăn..." />
      </mat-form-field>

      @if (isMobile) {
      <!-- Dưới 768px: không đủ chỗ cho 2 cột song song, giữ tab như trước. -->
      <mat-tab-group #tabGroup mat-stretch-tabs="false" mat-align-tabs="start">
        <mat-tab>
          <ng-template mat-tab-label>
            <h2 class="mat-tab-label">
              <span class="label">Khoản mục</span>
              <mat-icon class="icon">receipt</mat-icon>
            </h2>
          </ng-template>
          <div class="expense-form">
            <app-expense-form></app-expense-form>
          </div>
        </mat-tab>
        <mat-tab>
          <ng-template mat-tab-label>
            <h2 class="mat-tab-label">
              <span class="label">Thành viên</span>
              <mat-icon class="icon">groups</mat-icon>
            </h2>
          </ng-template>
          <div class="member-table">
            <app-member-table></app-member-table>
          </div>
        </mat-tab>
      </mat-tab-group>
      } @else {
      <!-- Từ 768px: Khoản mục và Thành viên song song, khỏi phải bấm qua lại giữa 2 tab liên tục. -->
      <div class="two-col-layout">
        <div class="expense-form">
          <app-expense-form></app-expense-form>
        </div>
        <div class="member-table">
          <app-member-table></app-member-table>
        </div>
      </div>
      }

      <!-- Thanh toán không còn là tab riêng ở bất kỳ breakpoint nào — luôn hiện ngay dưới. -->
      <div class="payment" id="payment-section">
        <app-payment></app-payment>
      </div>

      <app-image-upload [maxFiles]="5" [maxFileSize]="5*1024*1024" (imagesChanged)="onImagesChanged($event)">
      </app-image-upload>
    </mat-card-content>
  </mat-card>

  <div class="tear-line" aria-hidden="true"></div>

  <app-result-display></app-result-display>
  <app-bank></app-bank>
  @if (uploadProgress !== null) {
  <div class="upload-progress fixed bottom-24 right-7" role="status" aria-live="polite">
    <mat-progress-spinner mode="determinate" [value]="uploadProgress" diameter="40"></mat-progress-spinner>
    <span class="upload-progress__label">{{ uploadProgress }}%</span>
  </div>
  }

  <div class="buttons fixed bottom-7 right-7">
    <!-- Gộp còn 1 CTA duy nhất: share luôn tự lưu trước khi copy link, nên không mất khả năng
         lưu khi bỏ nút lưu riêng. -->
    <button mat-fab class="fab-gold share-button" aria-label="Lưu và sao chép link chia sẻ"
      matTooltip="Lưu và sao chép link chia sẻ" matTooltipPosition="left"
      [ngClass]="{'share-button__syncing': (isSaving$ | async)}" [disabled]="(isSaving$ | async)" (click)="save(true)">
      <mat-icon>{{(isSaving$ | async) ? 'sync' : 'share'}}</mat-icon>
    </button>
  </div>
</div>
