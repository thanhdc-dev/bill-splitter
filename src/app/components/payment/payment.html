<form [formGroup]="bankForm" class="inline-add-form payment-form">
  <mat-tab-group class="w-full">
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon>account_balance</mat-icon>
        <span class="pl-0.5">Ngân hàng</span>
      </ng-template>

      <mat-card>
        <app-bank-select class="select-bank" formControlName="bank" valueField="code"></app-bank-select>

        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic" class="flat-field account-name">
          <mat-label>Họ & Tên</mat-label>
          <input matInput type="text" formControlName="accountName" />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic" class="flat-field account-number">
          <mat-label>Số tài khoản</mat-label>
          <input matInput type="text" class="mono-text" formControlName="accountNumber" />
        </mat-form-field>
      </mat-card>
    </mat-tab>

    <mat-tab labelClass="momo">
      <ng-template mat-tab-label>
        <mat-icon>smartphone</mat-icon>
        <span class="pl-0.5">Momo</span>
      </ng-template>

      <mat-card>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic" class="flat-field account-name-momo">
          <mat-label>Họ & Tên</mat-label>
          <input matInput type="text" formControlName="accountNameMomo" />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic" class="flat-field phone-number-momo">
          <mat-label>Số điện thoại</mat-label>
          <input matInput type="text" class="mono-text" formControlName="phoneNumberMomo" />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic" class="flat-field account-number-momo">
          <mat-label>Số tài khoản</mat-label>
          <input matInput type="text" class="mono-text" formControlName="accountNumberMomo" />
        </mat-form-field>
      </mat-card>
    </mat-tab>
  </mat-tab-group>
</form>
