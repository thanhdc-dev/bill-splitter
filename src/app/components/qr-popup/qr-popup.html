<mat-card class="qr-popup-card">
  <mat-card-header>
    <mat-card-title>{{ title }}</mat-card-title>
    @if (subtitle) {
      <mat-card-subtitle class="qr-subtitle">{{ subtitle }}</mat-card-subtitle>
    }
    <button
      mat-icon-button
      class="close-button"
      aria-label="Đóng hộp thoại"
      (click)="closeDialog()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </mat-card-header>

  <mat-card-content>
    <div class="qr-image-container">
      <app-qr-image [src]="data.qrImageUrl" alt="Mã QR chuyển tiền" [framed]="true" />
      <span class="qr-caption">Quét mã để xem chi tiết</span>
    </div>
  </mat-card-content>

  <mat-card-actions align="end">
    <button
      mat-stroked-button
      (click)="closeDialog()"
    >
      Đóng
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="downloadQRCode()"
      class="download-button"
      aria-label="Tải xuống mã QR"
    >
      <mat-icon>download</mat-icon>
      Tải xuống
    </button>
  </mat-card-actions>
</mat-card>
