  <!-- Áp dụng giao diện Sáng/Tối trước khi Angular bootstrap để tránh nháy màu.
       Giữ đồng bộ với ThemeService (khóa localStorage 'theme'). -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('theme');
        var isDark = mode === 'dark' ||
          (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* localStorage bị chặn: dùng giao diện sáng mặc định */ }
    })();
  </script>
